name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install npm deps (incl. purs + spago)
        run: bun install --frozen-lockfile
      - name: Build PureScript
        run: bunx spago build
      - name: Generate routes
        run: bunx purs-rsc-routes
      - name: Build worker
        run: bun run worker
      - name: Build Next
        run: rm -rf .next && node --max-old-space-size=4096 node_modules/next/dist/bin/next build --webpack 2>&1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
